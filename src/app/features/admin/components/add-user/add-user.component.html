<form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="add-user-form">
    <mat-card>
        <mat-card-title>ADD USER</mat-card-title>
        <mat-card-content>
            <div>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Username</mat-label>
                    <input matInput type="text" id="username" name="username" [(ngModel)]="username" required />
                </mat-form-field>
            </div>
            <div>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Password</mat-label>
                    <input matInput type="password" id="password" name="password" [(ngModel)]="password" required />
                </mat-form-field>
            </div>
            <div>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Role</mat-label>
                    <mat-select id="role" name="role" [(ngModel)]="role" required>
                        <mat-option value="" disabled>Select role</mat-option>
                        <mat-option value="0">admin</mat-option>
                        <mat-option value="1">manager</mat-option>
                        <mat-option value="2">user</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div>
                <button mat-raised-button color="primary" type="submit"
                    [disabled]="registerForm.invalid">Register</button>
            </div>
        </mat-card-content>
    </mat-card>
</form>
