<form #resetForm="ngForm" (ngSubmit)="resetPassword(resetForm.value)" novalidate>
    <mat-card>
        <mat-card-title>Reset Password</mat-card-title>
        <mat-card-content>
            <div>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Old Password</mat-label>
                    <input matInput type="password" id="oldPassword" name="oldPassword" ngModel required minlength="6"
                        #oldPassword="ngModel" />
                    <mat-error *ngIf="oldPassword.invalid && oldPassword.touched">
                        Old password is required (min 6 chars).
                    </mat-error>
                </mat-form-field>
            </div>

            <div>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>New Password</mat-label>
                    <input matInput type="password" id="newPassword" name="newPassword" ngModel required minlength="6"
                        #newPassword="ngModel" />
                    <mat-error *ngIf="newPassword.invalid && newPassword.touched">
                        New password is required (min 6 chars).
                    </mat-error>
                </mat-form-field>
            </div>

            <div>
                <mat-form-field appearance="fill" class="full-width">
                    <mat-label>Confirm Password</mat-label>
                    <input matInput type="password" id="confirmPassword" name="confirmPassword" ngModel required
                        #confirmPassword="ngModel" />
                    <mat-error *ngIf="confirmPassword.invalid && confirmPassword.touched">
                        Confirm password is required.
                    </mat-error>
                    <mat-error
                        *ngIf="resetForm.value.newPassword !== resetForm.value.confirmPassword && confirmPassword.touched">
                        Passwords do not match.
                    </mat-error>
                </mat-form-field>
            </div>
        </mat-card-content>
        <mat-card-actions align="end">
            <button mat-raised-button color="primary" type="submit"
                [disabled]="resetForm.invalid || resetForm.value.newPassword !== resetForm.value.confirmPassword">
                Reset Password
            </button>
        </mat-card-actions>
    </mat-card>
</form>
