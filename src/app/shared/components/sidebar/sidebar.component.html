<div class="sidebar-container">
  <!-- Loading spinner -->
  <div *ngIf="loading" class="sidebar-loading">
    <mat-progress-spinner diameter="40"></mat-progress-spinner>
  </div>

  <!-- Main sidebar content -->
  <div *ngIf="!loading" class="sidebar-content">
    <mat-nav-list>

      <!-- Simple Menu Items (no children) -->
      <a *ngFor="let menu of menus | filterNoSubmenus"
         mat-list-item
         [routerLink]="menu.path"
         routerLinkActive="active-menu-item"
         [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon class="menu-icon">{{ menu.icon }}</mat-icon>
        <span class="menu-text">{{ menu.menu_name }}</span>
      </a>

      <!-- Expandable Menu Groups -->
      <mat-expansion-panel *ngFor="let menu of menus | filterWithSubmenus"
                           class="mat-elevation-z0 menu-expansion-panel"
                           [expanded]="expandedMenus[menu.id]">

        <!-- Group Header -->
        <mat-expansion-panel-header class="menu-group-header"
                                    (click)="toggleMenuExpansion(menu.id, $event)">
          <mat-panel-title>
            <mat-icon class="menu-icon">{{ menu.icon }}</mat-icon>
            <span class="menu-text">{{ menu.menu_name }}</span>
          </mat-panel-title>
        </mat-expansion-panel-header>

        <!-- Submenu Items -->
        <div class="submenu-container">
          <a *ngFor="let submenu of menu.submenus"
             mat-list-item
             [routerLink]="submenu.path"
             routerLinkActive="active-menu-item"
             class="submenu-item">
            <mat-icon class="submenu-icon">{{ submenu.icon }}</mat-icon>
            <span class="submenu-text">{{ submenu.sub_menu_name }}</span>
          </a>
        </div>
      </mat-expansion-panel>
    </mat-nav-list>
  </div>

  <!-- User info and logout -->
  <div class="sidebar-footer">
    <div class="user-info">
      <mat-icon>person</mat-icon>
      <span class="user-role">{{ getRole() }}</span>
    </div>
    <button mat-button color="warn" (click)="logout()" class="logout-button">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </div>
</div>
